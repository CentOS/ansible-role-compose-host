# Defaults variables for role compose-host

# local user that will kick pungi and other compose tasks
compose_local_user: pungi
# which specific local uid for the user (needed sometimes to match nfs perms)
compose_local_userid: 1337

# which ssh pub keys needs to be injected so that from control host (jenkins or else) we can trigger jobs
compose_local_user_sshkeys:
  - ssh-rsa bla
  - ssh-ed25519 foo

# koji client config
compose_koji_hub_url:
compose_koji_web_url:
compose_koji_files_url:
compose_koji_topdir: /mnt/koji
compose_koji_auth_tls: True
compose_koji_user: admin
compose_koji_pem: admin.pem
# If using kerberos
compose_koji_auth_kerberos: False
compose_koji_principal: koji-admin@DEV.CENTOS.ORG
compose_koji_keytab: koji-admin.keytab # Needed only if koji_auth_kerberos above and vice/versa with TLS

# Do we want to expose composes through httpd virtual_host[s] ?
compose_httpd_vhost: False
# httpd header for frontend composes index
compose_httpd_header_page:
  title: 'CentOS Stream Composes'
  title_lead: ''
  with_manifestation: 'CentOS Stream Composes'
  with_content:
    - element: p
      element_class: alert alert-info
      element_content: >-
        Learn more about the "development" and "production" composes in the <a href="https://docs.centos.org/centos-stream-docs/release/">CentOS Stream release docs</a>.

# List of virtual hosts exposing different docroot/views
compose_httpd_vhost_list:
  - fqdn: vhost1
    docroot: /var/www/html1
  - fqdn: vhost2
    docroot: /var/www/html2
